  #valkey:
  #  container_name: valkey
  #  image: valkey/valkey:alpine
  #  ports:
  #    - "6379:6379"
  #  restart: always
  #  labels:
  #   - "traefik.http.routers.valkey.rule=Host(`valkey`)"

  redis:
    container_name: redis
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: always
    labels:
     - "traefik.http.routers.redis.rule=Host(`redis`)"

  mysql:
    container_name: mysql
    image: mysql:8
    platform: linux/x86_64
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=1234
    restart: always
    volumes:
      - ./data/mysql:/var/lib/mysql
    labels:
     - "traefik.http.routers.mysql.rule=Host(`mysql`)"

  postgres:
    container_name: postgres
    image: postgres:alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=1234
      - POSTGRES_HOST_AUTH_METHOD=trust
    restart: always
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    labels:
     - "traefik.http.routers.postgres.rule=Host(`postgres`)"

  clickhouse:
    container_name: clickhouse
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9000:9000"
    restart: always
    volumes:
      - ./data/clickhouse:/var/lib/clickhouse
    labels:
     - "traefik.http.routers.clickhouse.rule=Host(`clickhouse`)"
