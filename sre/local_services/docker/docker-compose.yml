version: '3'

services:
  traefik:
    container_name: traefik
    # The official latest Traefik docker image
    image: traefik:v3
    # Enables the web UI and tells Traefik to listen to docker
    command: --api.insecure=true --providers.docker
    ports:
      # The HTTP port
      - "80:80"
      # The Web UI (enabled by --api.insecure=true)
      - "8081:8080"
    volumes:
      # So that Traefik can listen to the Docker events
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik:/traefik
    restart: always

  # testing services
  #whoami:
  #  # A container that exposes an API to show its IP address
  #  image: traefik/whoami
  #  restart: always
  #  labels:
  #   - "traefik.http.routers.whoami.rule=Host(`whoami.docker.localhost`)"

  # golinks for local go/xxx
  golinks:
    container_name: golinks
    image: golinks:local
    volumes:
      - ../creds/application_default_credentials.json:/app/application_default_credentials.json
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/application_default_credentials.json
    command: /go/bin/go --backend=firestore --project=golinks-27b48
    restart: always
    labels:
     - "traefik.http.routers.golinks.rule=Host(`go`)"

